services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: 4173
      DATA_DIR: /app/data
    volumes:
      - nba-data:/app/data
    expose:
      - "4173"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  nba-data:
  caddy-data:
  caddy-config:
